name: Build and Push

on:
  push:
  release:
    types: [published]
  schedule:
    - cron: "0 3 1 * *"

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest

